<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f4f8, #d9e2ec);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 28px 20px;
            width: 100%;
            max-width: 340px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size:13px;
            color:#6b7280;
            margin-bottom:10px;
        }

        /* 高级圆角玻璃按钮 */
        .btn {
            width: 100%;
            padding: 18px 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(209, 213, 219, 0.6);
            border-radius: 18px;
            font-size: 17px;
            font-weight: 500;
            color: #1f2937;
            text-align: center;
            cursor: pointer;
            transition: all 0.24s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.96);
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.09);
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .mc-tip {
            font-size: 12px;
            color:#b45309;
            margin:-6px 0 4px 0;
            text-align:center;
        }

        /* 更多按钮强调样式 */
        #moreBtn {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #292524;
            font-weight: 600;
            border: none;
        }

        a {
            text-decoration: none;
        }

        /* 弹窗样式升级 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }
        .modal-box {
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(16px);
            padding: 36px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
            border:1px solid rgba(255,255,255,0.7);
        }
        .modal-box p {
            margin-bottom: 26px;
            line-height: 1.75;
            color: #374151;
            font-size: 16px;
        }
        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .modal-btn {
            padding: 13px 22px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.22s ease;
        }
        .modal-btn.poki {
            background: #facc15;
            color: #292524;
            font-weight: 500;
        }
        .modal-btn.yandex {
            background: #2563eb;
            color: #fff;
            font-weight: 500;
        }
        .modal-close {
            background: #e5e7eb;
            color: #374151;
        }
        .modal-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">tyy485 游戏合集</div>
    <div class="subtitle">浏览器即开即玩，无需下载</div>

    <button class="btn" onclick="window.open('https://tyy485.github.io/zjdb/', '_blank')">指尖躲避</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/tanchishe/', '_blank')">贪吃蛇</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/catmove/', '_blank')">小猫移动</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/jfcz/', '_blank')">见缝插针</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/cdz/', '_blank')">吃豆子</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/dino/', '_blank')">谷歌小恐龙</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/jzq/', '_blank')">井字棋</button>

    <button class="btn" onclick="window.open('https://mcjs.link', '_blank')">我的世界</button>
    <div class="mc-tip">提示:原mcjs.cc已被封禁，点击后跳转为新网站</div>

    <button class="btn" onclick="window.open('https://tyy485.github.io/minecraft/', '_blank')">自制我的世界</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/block/', '_blank')">打砖块</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/jyfk/', '_blank')">记忆方块</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/sgxxl/', '_blank')">水果消消乐</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/xmdjs/', '_blank')">小猫打僵尸</button>
    <button class="btn" onclick="window.open('https://tyy485.github.io/elsfk/', '_blank')">俄罗斯方块</button>

    <button class="btn" id="moreBtn">更多游戏</button>
</div>

<div class="modal" id="routeModal">
    <div class="modal-box">
        <p>此为非tyy485网页！<br>请选择游戏平台路线：</p>
        <div class="modal-buttons">
            <button class="modal-btn poki" id="goPoki">Poki</button>
            <button class="modal-btn yandex" id="goYandex">Yandex</button>
        </div>
        <button class="modal-btn modal-close" id="closeModal">关闭</button>
    </div>
</div>

<script>
    const modal = document.getElementById('routeModal');
    const moreBtn = document.getElementById('moreBtn');
    const closeBtn = document.getElementById('closeModal');
    const goPoki = document.getElementById('goPoki');
    const goYandex = document.getElementById('goYandex');

    moreBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
    });

    function closeModal() {
        modal.style.display = 'none';
    }
    closeBtn.addEventListener('click', closeModal);

    goPoki.addEventListener('click', () => {
        window.open('https://poki.com', '_blank');
        closeModal();
    });

    goYandex.addEventListener('click', () => {
        window.open('https://game.yandex.com', '_blank');
        closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && modal.style.display === 'flex') {
            e.preventDefault();
            closeModal();
        }
    });

    window.addEventListener('popstate', () => {
        if (modal.style.display === 'flex') {
            closeModal();
            history.pushState(null, '', location.href);
        }
    });
    history.pushState(null, '', location.href);
</script>
</body>
</html>
