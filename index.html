<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        /* 极简容器 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        /* 黄色按钮 */
        .btn {
            width: 260px;
            padding: 16px 0;
            background-color: #f5d742;
            border: none;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 600;
            color: #3b2e1e;
            text-align: center;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        /* 简单按压效果 */
        .btn:active {
            transform: scale(0.97);
            background-color: #e6c935;
        }

        /* 去掉所有多余装饰 */
        a {
            text-decoration: none;
        }

        /* 自定义弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        .modal-box p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-btn.poki {
            background: #f5d742;
            color: #3b2e1e;
        }
        .modal-btn.yandex {
            background: #4285f4;
            color: #fff;
        }
        .modal-close {
            margin-top: 12px;
            background: #ddd;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 指尖躲避 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/zjdb/', '_blank')">指尖躲避</button>
    <!-- 贪吃蛇 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/tanchishe/', '_blank')">贪吃蛇</button>
    <!-- 小猫移动 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/catmove/', '_blank')">小猫移动</button>
    <!-- 见缝插针 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/jfcz/', '_blank')">见缝插针</button>
    <!-- 吃豆子 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/cdz/', '_blank')">吃豆子</button>
    <!-- 谷歌小恐龙 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/dino/', '_blank')">谷歌小恐龙</button>
    <!-- 井字棋 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/jzq/', '_blank')">井字棋</button>
    <!-- 第三方我的世界 mcjs.cc -->
    <button class="btn" onclick="window.open('https://mcjs.cc', '_blank')">我的世界</button>
    <!-- 自制我的世界 个人仓库版本 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/minecraft/', '_blank')">自制我的世界</button>
    <!-- 打砖块 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/block/', '_blank')">打砖块</button>
    <!-- 记忆方块 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/jyfk/', '_blank')">记忆方块</button>

    <!--
        注释规则：更多游戏固定放在整个按钮列表最后一行，后续新增游戏都加在这行上面，不要改动这行位置
    -->
    <!-- 更多游戏 第三方外网 -->
    <button class="btn" id="moreBtn">更多游戏</button>
</div>

<!-- 自定义弹窗 -->
<div class="modal" id="routeModal">
    <div class="modal-box">
        <p>此为非tyy485网页！<br>请选择游戏平台路线：</p>
        <div class="modal-buttons">
            <button class="modal-btn poki" id="goPoki">Poki</button>
            <button class="modal-btn yandex" id="goYandex">Yandex</button>
        </div>
        <button class="modal-btn modal-close" id="closeModal">关闭</button>
    </div>
</div>

<script>
    const modal = document.getElementById('routeModal');
    const moreBtn = document.getElementById('moreBtn');
    const closeBtn = document.getElementById('closeModal');
    const goPoki = document.getElementById('goPoki');
    const goYandex = document.getElementById('goYandex');

    // 打开弹窗
    moreBtn.addEventListener('click', () => {
        modal.style.display = 'flex';
    });

    // 关闭弹窗
    function closeModal() {
        modal.style.display = 'none';
    }
    closeBtn.addEventListener('click', closeModal);

    // 选择Poki
    goPoki.addEventListener('click', () => {
        window.open('https://poki.com', '_blank');
        closeModal();
    });

    // 选择Yandex
    goYandex.addEventListener('click', () => {
        window.open('https://game.yandex.com', '_blank');
        closeModal();
    });

    // 电脑端退格键关闭弹窗
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && modal.style.display === 'flex') {
            e.preventDefault();
            closeModal();
        }
    });

    // 监听浏览器返回键（手机物理返回/导航返回）
    window.addEventListener('popstate', () => {
        if (modal.style.display === 'flex') {
            closeModal();
            history.pushState(null, '', location.href);
        }
    });
    history.pushState(null, '', location.href);
</script>
</body>
</html>
