<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        /* 极简容器 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 20px;
        }

        /* 黄色按钮 */
        .btn {
            width: 260px;
            padding: 16px 0;
            background-color: #f5d742;
            border: none;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 600;
            color: #3b2e1e;
            text-align: center;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        /* 简单按压效果 */
        .btn:active {
            transform: scale(0.97);
            background-color: #e6c935;
        }

        /* 去掉所有多余装饰 */
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 指尖躲避 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/zjdb/', '_blank')">指尖躲避</button>
    <!-- 贪吃蛇 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/tanchishe/', '_blank')">贪吃蛇</button>
    <!-- 小猫移动 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/catmove/', '_blank')">小猫移动</button>
    <!-- 见缝插针 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/jfcz/', '_blank')">见缝插针</button>
    <!-- 吃豆子 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/cdz/', '_blank')">吃豆子</button>
    <!-- 谷歌小恐龙 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/dino/', '_blank')">谷歌小恐龙</button>
    <!-- 井字棋 -->
    <button class="btn" onclick="window.open('https://tyy485.github.io/jzq/', '_blank')">井字棋</button>
    <!-- 我的世界在线 -->
    <button class="btn" onclick="window.open('https://mcjs.cc', '_blank')">我的世界</button>
    <!-- 更多游戏（第三方） -->
    <button class="btn" onclick="if(confirm('此为非tyy485网页！如果有任何问题，请不要找我')) window.open('https://poki.com', '_blank')">更多游戏</button>
</div>
</body>
</html>
